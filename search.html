<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="搜索校园失物招领信息：按物品名称、描述、地点、分类关键词检索，命中词高亮显示。">
<title>搜索 · 校园失物招领</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
</head>
<body>

<div id="app-nav"></div>

<main class="page">
  <div id="app-banner"></div>

  <div class="page-head">
    <h1>搜索物品</h1>
    <p>支持物品名称、描述、地点、分类名，多个关键词用空格隔开（按「同时包含」匹配）。</p>
  </div>

  <form class="search-bar" id="searchForm" role="search">
    <label class="sr-only" for="searchInput">搜索关键词</label>
    <input class="search-input" id="searchInput" type="search" autocomplete="off"
           placeholder="例如：校园卡、图书馆、AirPods" enterkeyhint="search">
    <button class="btn btn-primary" id="searchBtn" type="submit">搜索</button>
  </form>

  <div class="tabs-inline" id="typeTabs"></div>

  <!-- 没输入关键词时显示：热门搜索 + 搜索历史；一旦开始搜索就换成结果列表 -->
  <section id="discover">
    <div class="panel">
      <h3>热门搜索</h3>
      <div class="chips" id="hotChips"></div>
      <p class="hint" style="margin-top:8px">按当前数据里"有多少条信息能被这个词搜到"排序。</p>
    </div>
    <div class="panel">
      <div class="panel-head">
        <h3>搜索历史</h3>
        <button class="btn btn-sm btn-ghost" id="clearHistory" type="button">清空</button>
      </div>
      <div class="chips" id="historyChips"></div>
    </div>
  </section>

  <section id="results" hidden>
    <div class="toolbar">
      <span id="resultCount" class="hint"></span>
      <span class="spacer"></span>
      <button class="btn btn-sm" id="clearKw" type="button">清空关键词</button>
    </div>
    <div id="resultHost"></div>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/page-search.js"></script>
</body>
</html>
